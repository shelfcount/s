<title>The Mash Recipe Book</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3F0; --panel:#FFFFFF; --panel-2:#F7F9F6; --rail:#EAEEE9;
  --ink:#14201C; --muted:#5E6B65; --faint:#899690;
  --rule:#D5DBD6; --rule-2:#E7ECE7;
  --accent:#4A7A2B; --accent-soft:#EAF2E1; --accent-ink:#FFFFFF;
  --crit:#A4322A; --crit-soft:#F7E6E4;
  --warn:#9E6A12; --warn-soft:#F8EFDE;
  --good:#2E6B4C; --good-soft:#E4F1EA;
  --field:#FFFFFF; --field-rule:#BFC9C1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0F1513; --panel:#161E1B; --panel-2:#1B2421; --rail:#131A18;
  --ink:#E7EDE8; --muted:#93A09A; --faint:#6C7975;
  --rule:#2A3531; --rule-2:#222C29;
  --accent:#93C463; --accent-soft:#1E2B18; --accent-ink:#0F1513;
  --crit:#E68B82; --crit-soft:#2E1917;
  --warn:#DDA94F; --warn-soft:#2B2113;
  --good:#7FC49F; --good-soft:#17281F;
  --field:#0C110F; --field-rule:#3B4742;
}}
:root[data-theme="dark"]{
  --ground:#0F1513; --panel:#161E1B; --panel-2:#1B2421; --rail:#131A18;
  --ink:#E7EDE8; --muted:#93A09A; --faint:#6C7975;
  --rule:#2A3531; --rule-2:#222C29;
  --accent:#93C463; --accent-soft:#1E2B18; --accent-ink:#0F1513;
  --crit:#E68B82; --crit-soft:#2E1917;
  --warn:#DDA94F; --warn-soft:#2B2113;
  --good:#7FC49F; --good-soft:#17281F;
  --field:#0C110F; --field-rule:#3B4742;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1{font-family:'Bitter',Georgia,serif;font-size:18px;font-weight:700;margin:0}
h2{font-family:'Bitter',Georgia,serif;font-size:16px;font-weight:600;margin:0}
input,select,button{font:inherit;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 120px}
.appbar{position:sticky;top:0;z-index:30;background:var(--rail);
  border-bottom:1px solid var(--rule);padding:10px 14px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.appbar .built{font-size:11px;color:var(--faint);margin-left:auto}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:12px;margin:12px 0}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  display:block;margin-bottom:5px}
.fld{width:100%;padding:9px 10px;border:1px solid var(--field-rule);border-radius:8px;
  background:var(--field);color:var(--ink)}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.grow{flex:1 1 200px;min-width:0}

/* the dish / product search: a real menu under the field, not the keyboard's
   suggestion strip, which is where a datalist ends up on iOS */
.srch{position:relative}
.srch-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  max-height:46vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.srch-menu div{padding:9px 11px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.srch-menu div:last-child{border-bottom:0}
.srch-menu div:hover,.srch-menu div.on{background:var(--accent-soft)}
.srch-menu .sub{display:block;font-size:11px;color:var(--muted)}
.nomatch{border-color:var(--crit)!important}

.line{border:1px solid var(--rule);border-radius:9px;padding:10px;margin:8px 0;
  background:var(--panel-2)}
.line .top{display:flex;gap:8px;align-items:baseline}
.line .nm{font-weight:600;flex:1 1 auto;min-width:0}
.line .cost{color:var(--muted);font-size:13px;white-space:nowrap}
.line .ctl{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qty{width:92px;padding:7px 9px;border:1px solid var(--field-rule);border-radius:7px;
  background:var(--field);color:var(--ink);text-align:right}
.uom{padding:7px 9px;border:1px solid var(--field-rule);border-radius:7px;
  background:var(--field);color:var(--ink)}
.b{padding:7px 11px;border:1px solid var(--field-rule);border-radius:7px;
  background:var(--panel);color:var(--ink);cursor:pointer}
.b:hover{border-color:var(--accent)}
.b.warn{color:var(--crit);border-color:var(--crit)}
.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.go[disabled]{opacity:.55;cursor:default}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;white-space:nowrap}
.t-measured{background:var(--good-soft);color:var(--good)}
.t-spec_sheet{background:var(--accent-soft);color:var(--accent)}
.t-estimated{background:var(--warn-soft);color:var(--warn)}
.t-none{background:var(--crit-soft);color:var(--crit)}
.src{font-size:11px;color:var(--faint);margin-top:5px;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--rule);margin-top:10px;padding-top:9px;font-weight:600}
.queue{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--rail);
  border-top:1px solid var(--rule);padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.queue .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center}
.qlist{max-width:820px;margin:0 auto 8px;max-height:26vh;overflow:auto}
.qitem{font-size:12px;padding:5px 0;border-bottom:1px solid var(--rule-2);
  display:flex;gap:8px;align-items:baseline}
.qitem .x{margin-left:auto;color:var(--crit);cursor:pointer;padding:0 6px}
.qitem.sent{color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1 1 auto;height:8px;background:var(--rail);border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 11px;border:1px solid var(--field-rule);border-radius:20px;
  background:var(--panel);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grp{margin:16px 0 6px;font-family:'Bitter',Georgia,serif;font-size:15px;font-weight:600}
.dishrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:9px;
  padding:11px 12px;margin:6px 0;cursor:pointer;color:inherit}
.dishrow:hover{border-color:var(--accent)}
.dishrow .nm{font-weight:600;flex:1 1 auto;min-width:0}
.dishrow .meta{display:block;font-size:12px;color:var(--muted);font-weight:400;
  margin-top:2px}
.dishrow .pc{font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:22px;text-align:center;color:var(--good);font-size:16px}
.tick.pend{color:var(--warn)}
.navcard{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.navcard .note{margin-left:auto}
.hide{display:none!important}
.empty{color:var(--muted);padding:18px 2px}
</style>

<div class="appbar">
  <h1 id="title">Recipe Book</h1>
  <span class="built mono" id="built"></span>
</div>

<div class="wrap">
  <div class="card" id="whoCard">
    <label class="lbl" for="who">who is checking these</label>
    <input class="fld" id="who" placeholder="your name" autocomplete="name">
    <div class="note" style="margin-top:9px">
      Work down the list and open each dish. Mark it checked when the build is
      right. Changes are queued and applied by the morning run &mdash; this page
      can send but cannot read the database back, so what you see is the recipe
      as of the last build, not a live view.
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="card">
      <div class="prog"><div class="bar"><span id="progBar"></span></div>
        <span class="mono" id="progText"></span></div>
      <div class="chips" id="filters"></div>
    </div>
    <div id="groups"></div>
  </div>

  <!-- DISH VIEW -->
  <div id="dishView" class="hide">
    <div class="card navcard">
      <button class="b" id="back">&larr; All dishes</button>
      <span class="note mono" id="pos"></span>
      <button class="b" id="prev">Prev</button>
      <button class="b" id="next">Next</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div class="queue hide" id="queue">
  <div class="qlist" id="qlist"></div>
  <div class="in">
    <span class="note mono" id="qcount"></span>
    <button class="b go" id="send" style="margin-left:auto">Send changes</button>
  </div>
</div>

/* ---------- costing -------------------------------------------------------
   The page converts a recipe line into the product's base unit using the SAME
   uom table the database uses, so a number shown here and a number computed
   there cannot drift. A unit that does not reduce to the product's base (a
   teaspoon of something sold by weight) returns null rather than a guess: a
   volume is not a weight without a density, and inventing one would put a
   confident wrong number in front of somebody. */
function toBase(qty, uom, base) {
  const u = uomBy[uom];
  if (!u || !isFinite(qty)) return null;
  if (u.base === base) return { q: qty * u.to_base, assumed: false };
  // WEIGHT AGAINST A PRODUCT SOLD BY VOLUME.
  // 71 lines are written in ounces against sauces, dressings and oils that GFS
  // bills by the litre — someone meant fluid ounces. The platform already costs
  // these by taking the gram figure and using it as millilitres, i.e. assuming
  // water. This page does the same so the two agree, but SAYS SO on the line:
  // an assumption you can see is a question someone can answer, and an
  // assumption you cannot see is a wrong number nobody looks for.
  // Refused outright for anything involving EA — a count is not a weight, and
  // there is no density that makes it one.
  if ((u.base === 'G' && base === 'ML') || (u.base === 'ML' && base === 'G')) {
    return { q: qty * u.to_base, assumed: true };
  }
  return null;
}
const cpbOf = (rec, item) =>
  (rec && rec.concept === 'brewpub') ? item.cpb_brew : item.cpb_mash;

function lineCost(rec, ln) {
  const item = ln.kind === 'product'
    ? PRODUCTS.find((p) => p.sku === ln.ref)
    : SUBS.find((s) => s.name === ln.ref);
  if (!item) return { cost: null, why: 'not in this build' };
  const cpb = cpbOf(rec, item);
  if (cpb == null) return { cost: null, why: 'no price yet' };
  const base = item.base;
  const c = toBase(ln.qty, ln.uom, base);
  if (c == null) return { cost: null, why: ln.uom + ' does not convert to ' + base };
  return { cost: c.q * cpb, why: null, assumed: c.assumed, base: base };
}

/* ---------- the search menu ----------------------------------------------
   Word-order independent, so "bun brioche" finds "Brioche Bun". Commits on
   pointerdown, not click: on iOS the field blurs first and a click handler
   never fires. */
function mkSearch(host, opts) {
  host.innerHTML = '';
  const inp = document.createElement('input');
  inp.className = 'fld'; inp.placeholder = opts.placeholder || 'type to search';
  inp.autocomplete = 'off'; inp.autocapitalize = 'none'; inp.spellcheck = false;
  const menu = document.createElement('div');
  menu.className = 'srch-menu hide';
  host.appendChild(inp); host.appendChild(menu);

  const render = () => {
    const q = inp.value.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const hits = !words.length ? opts.items.slice(0, 40)
      : opts.items.filter((it) => {
          const hay = (it.label + ' ' + (it.sub || '')).toLowerCase();
          return words.every((w) => hay.includes(w));
        }).slice(0, 40);
    menu.innerHTML = '';
    for (const it of hits) {
      const d = document.createElement('div');
      d.textContent = it.label;
      if (it.sub) { const s = document.createElement('span'); s.className = 'sub';
        s.textContent = it.sub; d.appendChild(s); }
      d.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        inp.value = it.label; menu.classList.add('hide');
        inp.classList.remove('nomatch');
        opts.onPick(it);
      });
      menu.appendChild(d);
    }
    menu.classList.toggle('hide', !hits.length);
    inp.classList.toggle('nomatch', !!words.length && !hits.length);
  };
  inp.addEventListener('focus', render);
  inp.addEventListener('input', render);
  inp.addEventListener('blur', () => setTimeout(() => menu.classList.add('hide'), 120));
  return inp;
}

/* ---------- the dish panel ------------------------------------------------ */
function drawDish() {
  const p = el('panel');
  p.innerHTML = '';
  if (!dish) {
    p.innerHTML = '<div class="card empty">Pick a dish to see what it is built from.</div>';
    return;
  }
  const card = document.createElement('div');
  card.className = 'card';
  const h = document.createElement('div');
  h.className = 'row';
  h.innerHTML = '<h2 style="flex:1 1 auto">' + esc(dish.name) + '</h2>'
    + '<span class="note mono">' + esc(dish.concept || '') + '</span>';
  card.appendChild(h);

  let total = 0, unpriced = 0;
  for (const ln of dish.lines) {
    const r = lineCost(dish, ln);
    if (r.cost == null) unpriced++; else total += r.cost;
    card.appendChild(drawLine(ln, r.cost, r.why, r.assumed ? ln.uom + ' read as fluid ' + ln.uom.toLowerCase() : null));
  }
  if (!dish.lines.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'This dish has no ingredients yet.';
    card.appendChild(e);
  }

  const tot = document.createElement('div');
  tot.className = 'tot';
  // An unpriced line is called out, never folded into the total as zero. A
  // plate cost that quietly omits an ingredient reads as a bargain, and a
  // bargain is the one number nobody investigates.
  // The food cost percentage is shown ONLY when nothing is missing: a
  // percentage computed from an incomplete plate cost is not a low number, it
  // is a wrong one, and it is the number people make decisions on.
  const pctBit = (dish.price && !unpriced)
    ? '  <span class="tag t-' + (total / dish.price <= 0.33 ? 'measured' : 'estimated')
      + '">' + Math.round(total / dish.price * 100) + '% of $' + dish.price.toFixed(2) + '</span>'
    : '';
  tot.innerHTML = '<span>plate cost</span><span class="mono">' + money(total)
    + (unpriced ? ' <span class="tag t-none">+ ' + unpriced + ' not costed</span>' : '')
    + pctBit + '</span>';
  card.appendChild(tot);

  const add = document.createElement('button');
  add.className = 'b'; add.textContent = '+ Add an ingredient';
  add.style.marginTop = '10px';
  add.onclick = () => openPicker(null, add);
  card.appendChild(add);
  p.appendChild(card);

  // The point of the list: say this one is right, and move on.
  const cs = confirmState(dish);
  const chk = document.createElement('div');
  chk.className = 'card';
  if (cs === 'no') {
    const btn = document.createElement('button');
    btn.className = 'b go'; btn.textContent = 'Looks right — mark checked';
    btn.onclick = () => {
      // Where we are must be read BEFORE the confirmation lands, because under
      // the default 'not checked yet' filter this dish is about to leave the
      // list and the next one slides into the index it just vacated. Reading it
      // afterwards finds -1 and sends the chef back to the top of the list.
      const before = visible();
      const i = before.indexOf(dish);
      push({ action: 'confirm' }, 'checked — build is right');
      const after = visible();
      if (!after.length) { drawList(); return; }
      openDish(after[i] || after[Math.min(Math.max(i, 0), after.length - 1)]);
    };
    chk.appendChild(btn);
    const n = document.createElement('div');
    n.className = 'note'; n.style.marginTop = '8px';
    n.textContent = 'Marking it checked records that a person looked at this '
      + 'build. It does not claim the portions were weighed — the badges above '
      + 'still say where each number came from.';
    chk.appendChild(n);
  } else {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = cs === 'pending'
      ? 'Checked — not sent yet.'
      : 'Checked' + (dish.reviewed_by ? ' by ' + dish.reviewed_by : '')
        + (dish.reviewed_on ? ' on ' + dish.reviewed_on : '') + '.';
    chk.appendChild(n);
  }
  p.appendChild(chk);
}

function drawLine(ln, cost, why, assumed) {
  const d = document.createElement('div');
  d.className = 'line';

  const top = document.createElement('div');
  top.className = 'top';
  const basis = ln.basis || 'none';
  top.innerHTML = '<span class="nm">' + esc(ln.name) + '</span>'
    + '<span class="tag t-' + basis + '">' + basis.replace('_', ' ') + '</span>'
    + '<span class="cost mono">' + (cost == null ? esc(why || '—') : money(cost)) + '</span>';
  d.appendChild(top);

  const ctl = document.createElement('div');
  ctl.className = 'ctl';

  const qty = document.createElement('input');
  qty.className = 'qty mono'; qty.type = 'text'; qty.inputMode = 'decimal';
  qty.value = String(ln.qty);
  const uomSel = document.createElement('select');
  uomSel.className = 'uom';
  for (const u of LINE_UOMS) {
    const o = document.createElement('option'); o.value = u; o.textContent = u;
    if (u === ln.uom) o.selected = true; uomSel.appendChild(o);
  }
  if (!LINE_UOMS.includes(ln.uom)) {
    const o = document.createElement('option');
    o.value = ln.uom; o.textContent = ln.uom; o.selected = true;
    uomSel.insertBefore(o, uomSel.firstChild);
  }
  const commitQty = () => {
    const v = parseFloat(qty.value);
    if (!isFinite(v) || v <= 0) { qty.value = String(ln.qty); return; }
    if (v === ln.qty && uomSel.value === ln.uom) return;
    push({ action: 'set_qty', line: ln, qty: v, uom: uomSel.value },
      ln.name + ' → ' + v + ' ' + uomSel.value);
    ln.qty = v; ln.uom = uomSel.value; ln.basis = 'measured';
    drawDish();
  };
  qty.addEventListener('change', commitQty);
  uomSel.addEventListener('change', commitQty);

  const swap = document.createElement('button');
  swap.className = 'b'; swap.textContent = 'Change ingredient';
  swap.onclick = () => openPicker(ln, swap);

  const del = document.createElement('button');
  del.className = 'b warn'; del.textContent = 'Remove';
  del.onclick = () => {
    push({ action: 'remove', line: ln }, 'remove ' + ln.name);
    dish.lines = dish.lines.filter((x) => x !== ln);
    drawDish();
  };

  ctl.appendChild(qty); ctl.appendChild(uomSel);
  ctl.appendChild(swap); ctl.appendChild(del);
  d.appendChild(ctl);

  if (assumed) {
    const a = document.createElement('div');
    a.className = 'src'; a.style.color = 'var(--warn)';
    a.textContent = 'assumed: ' + assumed + ' (this is sold by volume) — '
      + 'change the unit above if that is wrong';
    d.appendChild(a);
  }
  if (ln.source) {
    const s = document.createElement('div');
    s.className = 'src';
    s.textContent = ln.source + (ln.on ? '  ·  ' + ln.on : '');
    d.appendChild(s);
  }
  return d;
}

/* Picker for both "change this line" and "add a line". Products the brewpub has
   never been invoiced for are still offered but marked, because a brewpub dish
   built from a Mash-only SKU is usually a mis-pick, not a new purchase. */
function openPicker(ln, anchor) {
  const host = document.createElement('div');
  host.className = 'srch'; host.style.margin = '10px 0';
  anchor.after(host);
  const brew = dish.concept === 'brewpub';
  const items = [
    ...SUBS.filter((s) => !s.concept || s.concept === dish.concept)
      .map((s) => ({ label: s.name, sub: 'made in house', kind: 'sub', ref: s.name })),
    ...PRODUCTS.map((p) => ({
      label: p.name,
      sub: p.sku + (brew && !p.at_brewpub ? '  ·  not bought at the brewpub' : ''),
      kind: 'product', ref: p.sku,
    })),
  ];
  const inp = mkSearch(host, {
    placeholder: ln ? 'what should it be instead?' : 'what goes in?',
    items,
    onPick: (it) => {
      if (dish.lines.some((x) => x !== ln && x.kind === it.kind && x.ref === it.ref)) {
        alertInline(host, 'This dish already has a line for that. Change the '
          + 'existing line instead — two lines for one ingredient halves the '
          + 'apparent cost of the dish.');
        return;
      }
      if (ln) {
        push({ action: 'repoint', line: ln, to: it }, ln.name + ' → ' + it.label);
        ln.kind = it.kind; ln.ref = it.ref; ln.name = it.label; ln.basis = 'measured';
      } else {
        const nl = { kind: it.kind, ref: it.ref, name: it.label, qty: 1,
          uom: it.kind === 'sub' ? 'G' : 'EA', basis: 'measured', source: null, on: null };
        dish.lines.push(nl);
        push({ action: 'add', line: nl, to: it }, 'add ' + it.label);
      }
      host.remove();
      drawDish();
    },
  });
  inp.focus();
}

function alertInline(host, msg) {
  let n = host.querySelector('.inline-warn');
  if (!n) { n = document.createElement('div'); n.className = 'inline-warn note';
    n.style.color = 'var(--crit)'; n.style.marginTop = '6px'; host.appendChild(n); }
  n.textContent = msg;
}

/* ---------- the queue ----------------------------------------------------- */
function push(e, label) {
  queue.push({
    id: (crypto.randomUUID ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2)),
    submitted_at: new Date().toISOString(),
    recipe_name: dish.name,
    action: e.action,
    from_product_sku: e.line && e.action !== 'add' && e.line.kind === 'product' ? e.line.ref : null,
    from_sub_recipe:  e.line && e.action !== 'add' && e.line.kind === 'sub' ? e.line.ref : null,
    to_product_sku: e.to && e.to.kind === 'product' ? e.to.ref : null,
    to_sub_recipe:  e.to && e.to.kind === 'sub' ? e.to.ref : null,
    qty: e.qty != null ? e.qty : (e.action === 'add' ? e.line.qty : null),
    uom: e.uom || (e.action === 'add' ? e.line.uom : null),
    concept: dish.concept,
    label: dish.name + ': ' + label,
    sent: false,
  });
  saveQueue(); drawQueue();
}

function drawQueue() {
  const pending = queue.filter((q) => !q.sent);
  el('queue').classList.toggle('hide', !queue.length);
  el('qcount').textContent = pending.length
    ? pending.length + ' change' + (pending.length === 1 ? '' : 's') + ' not sent yet'
    : queue.length + ' sent';
  const list = el('qlist'); list.innerHTML = '';
  for (const q of queue.slice(-40)) {
    const d = document.createElement('div');
    d.className = 'qitem' + (q.sent ? ' sent' : '');
    d.innerHTML = '<span>' + (q.sent ? '✓ ' : '') + esc(q.label) + '</span>';
    if (!q.sent) {
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '✕'; x.title = 'drop this change';
      x.onclick = () => { queue = queue.filter((y) => y !== q); saveQueue(); drawQueue(); };
      d.appendChild(x);
    }
    list.appendChild(d);
  }
  const btn = el('send');
  btn.disabled = !pending.length;
  btn.textContent = pending.length ? 'Send ' + pending.length + ' change'
    + (pending.length === 1 ? '' : 's') : 'Sent';
}

/* Sending is one row per change, each with its own id, so a half-finished send
   can be finished rather than restarted. The button locks while it runs: the
   count sheet was submitted twice 39 seconds apart on its first real outing
   because the confirmation was not loud enough. */
el('send').onclick = async () => {
  const btn = el('send');
  const who = el('who').value.trim();
  if (!who) { el('who').focus(); el('who').classList.add('nomatch'); return; }
  el('who').classList.remove('nomatch');
  btn.disabled = true; btn.textContent = 'Sending…';
  let failed = 0;
  for (const q of queue.filter((x) => !x.sent)) {
    try {
      const res = await fetch(SUPA, {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY,
                   'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: q.id, submitted_at: q.submitted_at, edited_by: who,
          recipe_name: q.recipe_name, action: q.action,
          from_product_sku: q.from_product_sku, from_sub_recipe: q.from_sub_recipe,
          to_product_sku: q.to_product_sku, to_sub_recipe: q.to_sub_recipe,
          qty: q.qty, uom: q.uom, reason: q.label,
        }),
      });
      if (res.ok) { q.sent = true; saveQueue(); } else { failed++; }
    } catch (e) { failed++; }
  }
  drawQueue();
  if (!el('listView').classList.contains('hide')) drawList();
  if (failed) {
    btn.disabled = false;
    btn.textContent = 'Retry ' + failed + ' that did not send';
  } else {
    btn.textContent = 'Sent — applies at the next morning run';
  }
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

/* ---------- the list ------------------------------------------------------
   A search box assumes you already know which dish is wrong. The chef does not
   — that is the whole point of the exercise — so the default view is every
   dish, in order, with enough on each row to decide whether to open it. */

const CONCEPTS = [
  { key: 'brewpub', label: 'Half Hitch — Cochrane Brewpub' },
  { key: 'mash', label: 'The Mash' },
  { key: null, label: 'Everything else' },
];
const FILTERS = [
  { key: 'all',    label: 'All' },
  { key: 'todo',   label: 'Not checked yet' },
  { key: 'est',    label: 'Has estimates' },
  { key: 'nocost', label: 'Not fully costed' },
  { key: 'suspect', label: 'Cost looks wrong' },
];
let filter = 'todo';
try { filter = localStorage.getItem('hhbc.recipeFilter') || 'todo'; } catch (e) {}

/* A dish is checked if the database says so, or if a confirmation for it is
   sitting in the queue. Both are shown, but not as the same thing: one is a
   fact the platform holds, the other is a claim this browser has not sent yet.
   Treating them alike is how someone loses an afternoon's work and believes it
   was saved. */
const confirmState = (r) => {
  const q = queue.filter((x) => x.recipe_name === r.name && x.action === 'confirm');
  if (q.some((x) => !x.sent)) return 'pending';
  if (q.length || r.reviewed_by) return 'done';
  return 'no';
};

function stats(r) {
  let est = 0, nocost = 0;
  for (const ln of r.lines) {
    if (ln.basis === 'estimated') est++;
    if (lineCost(r, ln).cost == null) nocost++;
  }
  return { est, nocost };
}

function matches(r) {
  const st = stats(r);
  if (filter === 'todo')   return confirmState(r) === 'no';
  if (filter === 'est')    return st.est > 0;
  if (filter === 'nocost') return st.nocost > 0;
  // A theoretical plate cost above 45% of the menu price is not a costing, it
  // is a symptom: a workbook sheet that was written per batch rather than per
  // plate, or a line whose unit means something other than what it says. The
  // Berry Parfait costs $25 against an $11 price because its sheet lists eight
  // pounds of strawberries. These go first.
  if (filter === 'suspect') {
    if (!r.price || st.nocost) return false;
    let t = 0;
    for (const ln of r.lines) { const c = lineCost(r, ln).cost; if (c != null) t += c; }
    return t / r.price > 0.45;
  }
  return true;
}

const visible = () => RECIPES.filter(matches);

function drawList() {
  el('listView').classList.remove('hide');
  el('dishView').classList.add('hide');
  el('whoCard').classList.remove('hide');
  el('title').textContent = BOOK;

  const done = RECIPES.filter((r) => confirmState(r) !== 'no').length;
  const pct = RECIPES.length ? Math.round(done / RECIPES.length * 100) : 0;
  el('progBar').style.width = pct + '%';
  el('progText').textContent = done + ' of ' + RECIPES.length + ' checked';

  const f = el('filters'); f.innerHTML = '';
  for (const ft of FILTERS) {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === ft.key ? ' on' : '');
    const n = RECIPES.filter((r) => { const o = filter; filter = ft.key;
      const m = matches(r); filter = o; return m; }).length;
    b.textContent = ft.label + ' (' + n + ')';
    b.onclick = () => { filter = ft.key;
      try { localStorage.setItem('hhbc.recipeFilter', filter); } catch (e) {}
      drawList(); };
    f.appendChild(b);
  }

  const g = el('groups'); g.innerHTML = '';
  const shown = visible();
  if (!shown.length) {
    const e = document.createElement('div');
    e.className = 'card empty';
    e.textContent = filter === 'todo'
      ? 'Every dish has been checked. Switch to All to look again.'
      : 'Nothing matches that filter.';
    g.appendChild(e);
    return;
  }
  for (const r of shown) g.appendChild(dishRow(r));
}

function dishRow(r) {
  const st = stats(r);
  let total = 0;
  for (const ln of r.lines) { const c = lineCost(r, ln).cost; if (c != null) total += c; }

  const b = document.createElement('button');
  b.className = 'dishrow';
  const cs = confirmState(r);

  const tick = document.createElement('span');
  tick.className = 'tick' + (cs === 'pending' ? ' pend' : '');
  tick.textContent = cs === 'no' ? '' : (cs === 'pending' ? '•' : '✓');
  tick.title = cs === 'pending' ? 'checked, not sent yet'
    : cs === 'done' ? ('checked' + (r.reviewed_by ? ' by ' + r.reviewed_by : '')) : '';

  const nm = document.createElement('span');
  nm.className = 'nm';
  const bits = [r.lines.length + ' ingredient' + (r.lines.length === 1 ? '' : 's')];
  if (st.est) bits.push(st.est + ' estimated');
  if (st.nocost) bits.push(st.nocost + ' not costed');
  nm.innerHTML = esc(r.name) + '<span class="meta">' + esc(bits.join('  ·  ')) + '</span>';

  const pc = document.createElement('span');
  pc.className = 'pc';
  pc.textContent = st.nocost === r.lines.length && r.lines.length ? '—' : money(total);

  b.appendChild(tick); b.appendChild(nm); b.appendChild(pc);
  b.onclick = () => openDish(r);
  return b;
}

function openDish(r) {
  dish = r;
  el('listView').classList.add('hide');
  el('dishView').classList.remove('hide');
  el('whoCard').classList.add('hide');
  el('title').textContent = BOOK;
  const list = visible();
  const i = list.indexOf(r);
  el('pos').textContent = i >= 0 ? (i + 1) + ' of ' + list.length : '';
  el('prev').disabled = i <= 0;
  el('next').disabled = i < 0 || i >= list.length - 1;
  window.scrollTo(0, 0);
  drawDish();
}

const step = (d) => {
  const list = visible();
  const i = list.indexOf(dish);
  // The filter is 'not checked yet' by default, so confirming a dish drops it
  // out of the list and the NEXT one slides into the same index. Stepping by
  // +1 there would skip a dish silently, which on a list nobody would notice.
  const j = i < 0 ? 0 : i + d;
  if (list[j]) openDish(list[j]);
  else if (d > 0 && list.length) openDish(list[Math.min(i, list.length - 1)]);
  else drawList();
};
el('back').onclick = drawList;
el('prev').onclick = () => step(-1);
el('next').onclick = () => step(1);

drawList();
drawQueue();
</script>
