<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Half Hitch Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3F0; --panel:#FFFFFF; --panel-2:#F7F9F6; --raise:#FFFFFF;
  --ink:#14201C; --muted:#5E6B65; --faint:#899690;
  --rule:#D5DBD6; --rule-2:#E7ECE7;
  --accent:#4A7A2B; --accent-soft:#EAF2E1; --accent-ink:#FFFFFF;
  --crit:#A4322A; --crit-soft:#F7E6E4;
  --warn:#9E6A12; --warn-soft:#F8EFDE;
  --good:#2E6B4C; --good-soft:#E4F1EA;
  --field:#FFFFFF; --field-rule:#BFC9C1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0F1513; --panel:#161E1B; --panel-2:#1B2421; --raise:#1E2723;
  --ink:#E7EDE8; --muted:#93A09A; --faint:#6C7975;
  --rule:#2A3531; --rule-2:#222C29;
  --accent:#93C463; --accent-soft:#1E2B18; --accent-ink:#0F1513;
  --crit:#E68B82; --crit-soft:#2E1917;
  --warn:#DDA94F; --warn-soft:#2B2113;
  --good:#7FC49F; --good-soft:#17281F;
  --field:#0C110F; --field-rule:#3B4742;
}}
:root[data-theme="dark"]{
  --ground:#0F1513; --panel:#161E1B; --panel-2:#1B2421; --raise:#1E2723;
  --ink:#E7EDE8; --muted:#93A09A; --faint:#6C7975;
  --rule:#2A3531; --rule-2:#222C29;
  --accent:#93C463; --accent-soft:#1E2B18; --accent-ink:#0F1513;
  --crit:#E68B82; --crit-soft:#2E1917;
  --warn:#DDA94F; --warn-soft:#2B2113;
  --good:#7FC49F; --good-soft:#17281F;
  --field:#0C110F; --field-rule:#3B4742;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
h1{font-family:'Bitter',Georgia,serif; font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em}
h2{font-family:'Bitter',Georgia,serif; font-size:17px; font-weight:600; margin:0}
.wrap{max-width:760px; margin:0 auto; background:var(--panel); min-height:100vh}
.top{position:sticky; top:0; z-index:40; background:var(--panel); border-bottom:1px solid var(--rule); padding:12px 14px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.who{flex:1 1 190px; min-width:150px}
input[type=text],input[type=search],select{font:inherit; padding:9px 10px; border:1px solid var(--field-rule);
  border-radius:8px; background:var(--field); color:var(--ink); width:100%}
input.nomatch{border-color:var(--crit); background:var(--crit-soft)}
.tabs{display:flex; gap:0; margin-top:10px; border:1px solid var(--rule); border-radius:9px; overflow:hidden}
.tab{flex:1; padding:9px 6px; text-align:center; font-size:13.5px; font-weight:500; cursor:pointer;
  background:var(--panel); color:var(--muted); border:0; border-right:1px solid var(--rule); font-family:inherit}
.tab:last-child{border-right:0}
.tab[aria-selected=true]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.tab .n{font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:.85; display:block}
.btn{font:inherit; font-size:13.5px; padding:8px 12px; border-radius:8px; border:1px solid var(--field-rule);
  background:var(--panel-2); color:var(--ink); cursor:pointer; font-family:inherit}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.btn.pri:disabled{opacity:.45; cursor:default}
.btn.warn{border-color:var(--warn); color:var(--warn)}
.btn.crit{border-color:var(--crit); color:var(--crit)}
.btn.sm{font-size:12px; padding:5px 9px}
.stat{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted)}
.zhead{position:sticky; top:0; z-index:20; background:var(--panel-2); border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule); padding:7px 14px; display:flex; justify-content:space-between;
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.item{border-bottom:1px solid var(--rule-2); background:var(--panel); padding:11px 14px; cursor:pointer;
  display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center}
.item:hover{background:var(--panel-2)}
.item.na{opacity:.45}
.nm{font-size:14.5px; font-weight:500; line-height:1.3}
.sub{grid-column:1/2; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--faint)}
.chip{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 7px; border-radius:20px; white-space:nowrap}
.chip.ok{background:var(--good-soft); color:var(--good)}
.chip.no{background:var(--crit-soft); color:var(--crit)}
.chip.q{background:var(--warn-soft); color:var(--warn)}
.chip.na{background:var(--rule-2); color:var(--faint)}
.pane{padding:14px}
/* A LINE IS A QUESTION WITH FOUR ANSWERS, NOT A FORM (owner, 2 Sep 2026):
     "i want that but on a checkbox he can go though online like the counter
      one, he can check yes correct or chaneg item or qty, or check old item"
   The old row put a text input and a dropdown on every ingredient, so the
   fast answer — "that one's right" — cost as much attention as the slow one.
   Now every line reads as a statement with four taps under it, and the taps
   are thumb-sized because this is used standing up. */
.line{padding:10px 0; border-bottom:1px solid var(--rule-2)}
.line:last-child{border-bottom:0}
.line .ing{font-size:14.5px; line-height:1.3}
.line .ing small{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--faint); margin-top:2px}
.line .amt{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; white-space:nowrap}
.line .amt.none{color:var(--crit); font-weight:500; font-size:13px}
/* NOT .top. That is the page masthead's class — sticky, z-index 40, white
   background, 12px padding — and reusing the name gave every ingredient row a
   white block, a padding it did not ask for, and a stacking context. The
   answered-line tint appeared to cover only half the row. Second time today a
   selector collision has produced a bug that reads as a rendering fault. */
.line .lrow{display:flex; gap:10px; align-items:baseline}
.line .lrow .ing{flex:1}
.taps{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.tap{font:inherit; font-size:13px; padding:8px 11px; border-radius:8px; cursor:pointer;
  border:1px solid var(--field-rule); background:var(--panel-2); color:var(--ink); flex:0 0 auto}
.tap:hover{background:var(--accent-soft)}
.tap.yes{font-weight:600}
.tap.yes[aria-pressed=true]{background:var(--good); border-color:var(--good); color:var(--accent-ink)}
.tap.old[aria-pressed=true]{background:var(--crit); border-color:var(--crit); color:#fff}
.tap.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.line.answered{background:var(--good-soft)}
.line.answered .ing{opacity:.75}
.line.dropped .ing{text-decoration:line-through; opacity:.55}
.qedit{display:flex; gap:7px; margin-top:8px; align-items:center}
.qedit input{padding:9px 10px; font-size:15px; flex:0 0 96px}
.qedit select{padding:9px 6px; font-size:14px; flex:0 0 86px; width:auto}
.answer{margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--good)}
.answer.crit{color:var(--crit)}
.bar{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.note{background:var(--panel-2); border-left:3px solid var(--accent); padding:9px 12px; font-size:13.5px;
  color:var(--muted); margin:10px 0; border-radius:0 6px 6px 0}
.note.crit{border-left-color:var(--crit)}
.hide{display:none!important}  /* !important because .sheet{display:flex} below is the same
   specificity and wins on source order: the picker overlay covered the whole page and
   swallowed every tap. Found by the headless check, not by reading it. */
.sheet{position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:60; display:flex; align-items:flex-end}
.sheet .card{background:var(--panel); width:100%; max-width:760px; margin:0 auto; max-height:86vh;
  overflow:auto; border-radius:14px 14px 0 0; padding:14px}
.hit{padding:10px 8px; border-bottom:1px solid var(--rule-2); cursor:pointer; font-size:14px}
.hit:hover{background:var(--accent-soft)}
.hit small{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--faint)}
.send{position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--rule); padding:11px 14px;
  display:flex; gap:9px; align-items:center}
.q{font-size:12.5px; color:var(--muted); flex:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Half Hitch Kitchen</h1>
    <div class="stat" id="hdr">recipe check &middot; Cochrane brewpub &amp; loft</div>
    <div class="row" style="margin-top:9px">
      <div class="who"><input type="text" id="who" placeholder="Your name" autocomplete="name"></div>
      <button class="btn sm" id="showNa">Show hidden</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-dish"  aria-selected="true">Dishes<span class="n" id="n-dish"></span></button>
      <button class="tab" role="tab" id="t-batch" aria-selected="false">Sauces &amp; batches<span class="n" id="n-batch"></span></button>
      <button class="tab" role="tab" id="t-link"  aria-selected="false">Needs a recipe<span class="n" id="n-link"></span></button>
    </div>
  </div>

  <div id="listView"></div>
  <div id="editView" class="hide"></div>

  <div class="send">
    <span class="q" id="qtxt">Nothing to send yet</span>
    <button class="btn pri" id="send" disabled>Send</button>
  </div>
</div>

<div class="sheet hide" id="picker">
  <div class="card">
    <div class="row"><h2 style="flex:1" id="pickTitle">Find an item</h2>
      <button class="btn sm" id="pickClose">Close</button></div>
    <div style="margin:10px 0"><input type="search" id="pickQ" placeholder="Type part of a name or a GFS number"></div>
    <div id="pickHits"></div>
  </div>
</div>

    d.onclick = () => { el('picker').classList.add('hide'); const cb = pickCb; pickCb = null; if (cb) cb(h.pick); };
    box.appendChild(d);
  }
}

/* ---------- making one from nothing --------------------------------------- */
/* WHY: half the sauces the kitchen makes are not in the database at all, under
   any name. Without this he can only correct what we already guessed at, and
   the things only he knows about stay unwritten. */
function newThing(kind) {
  const what = kind === 'batch' ? 'sauce or batch' : 'dish';
  const list = kind === 'batch' ? DATA.batches : DATA.dishes;   /* dishes are menu items */
  const name = (prompt('Name of the new ' + what + '?\n\nWrite it the way the kitchen says it.') || '').trim();
  if (!name) return;
  if (list.some((x) => x.name.toLowerCase() === name.toLowerCase())) {
    alert('There is already one called that. Open it from the list and edit it instead.');
    return;
  }
  let yq = null, yu = null;
  if (kind === 'batch') {
    /* A batch with no yield cannot cost anything that uses it, and the loader
       refuses it rather than guessing. Better to ask now than to send him a
       list of rejects tomorrow. */
    yq = parseFloat(prompt('What does ONE batch make?\n\nA number. Weight is best — 2000 for a 2 kg tub.', '') || '');
    if (!(yq > 0)) { alert('A batch needs to say what it makes, or nothing built from it can be costed. Nothing was created.'); return; }
    yu = ((prompt('In what unit?\n\n' + LINE_UOMS.join('  '), 'G') || '')).trim().toUpperCase();
    if (!LINE_UOMS.includes(yu)) { alert('Use one of: ' + LINE_UOMS.join(', ') + '. Nothing was created.'); return; }
  }
  made.push({ kind, name, yield: yq ? yq + ' ' + yu : null });
  saveMade();
  if (kind === 'batch') DATA.batches.unshift({ name, yield: yq + ' ' + yu, blocks: 0, lines: [], mine: true });
  else DATA.dishes.unshift({ name, handle: name, recipe: null, pos: [], price: null, cost: null,
                             sizes: null, reviewed_by: null, lines: [], mine: true });
  push({ target_kind: kind, recipe_name: name, action: 'new_recipe',
         yield_qty: yq, yield_uom: yu,
         label: 'new ' + what + ' added from the kitchen page' });
  open = { kind, name };
  draw();
}

function newBar(v, kind) {
  const b = document.createElement('div');
  b.className = 'bar'; b.style.padding = '11px 14px';
  const btn = document.createElement('button');
  btn.className = 'btn pri';
  btn.textContent = kind === 'batch' ? '+ Add a sauce or batch we make' : '+ Add a dish that is missing';
  btn.onclick = () => newThing(kind);
  b.appendChild(btn);
  v.appendChild(b);
}

/* ---------- lists --------------------------------------------------------- */
el('t-dish').onclick  = () => { tab = 'dish';  open = null; draw(); };
el('t-batch').onclick = () => { tab = 'batch'; open = null; draw(); };
el('t-link').onclick  = () => { tab = 'link';  open = null; draw(); };
el('showNa').onclick  = () => { showNa = !showNa; el('showNa').textContent = showNa ? 'Hide hidden' : 'Show hidden'; draw(); };

function counts() {
  /* The badge counts what has nothing behind it, because that is the number
     that moves when he works. "55 to check" is true and useless. */
  const d = DATA.dishes.filter((x) =>
    (!x.recipe || !(x.lines || []).length) && !isNa('dish', x.handle)).length;
  const b = DATA.batches.filter((x) => !isNa('batch', x.name) && !x.lines.length).length;
  el('n-dish').textContent = d ? d + ' no recipe' : DATA.dishes.length + ' to check';
  /* The tab badge counts the items still selling — the work that is real.
     "112 left" on a list where 59 are discontinued reads as hopeless, and a
     number that never moves is a number nobody trusts. */
  const l = DATA.needlink.filter((x) => !isNa('pos_item', x[0]) && !x[5] && x[4] <= 14).length;
  el('n-batch').textContent = b + ' to write';
  el('n-link').textContent  = l + ' still selling';
}

function draw() {
  counts();
  for (const t of ['dish','batch','link'])
    el('t-' + t).setAttribute('aria-selected', String(t === tab));
  el('editView').classList.add('hide');
  el('listView').classList.remove('hide');
  if (open) return drawEdit();
  const v = el('listView');
  v.innerHTML = '';
  if (tab === 'dish')  drawDishes(v);
  if (tab === 'batch') drawBatches(v);
  if (tab === 'link')  drawNeedLink(v);
}

function head(v, label, right) {
  const h = document.createElement('div');
  h.className = 'zhead';
  h.innerHTML = '<span>' + esc(label) + '</span><span>' + esc(right || '') + '</span>';
  v.appendChild(h);
}

/* KEY AND LABEL ARE DIFFERENT THINGS.
   The menu says "Coffee Adobo Braised Beef Short Rib"; the recipe is called
   "Beef Short Rib" and that is what an edit has to be filed against. Showing
   one and filing the other is the whole point of carrying both. */
function rowFor(v, kind, key, label, subtext, chip, onOpen) {
  const na = isNa(kind, key);
  if (na && !showNa) return;
  const d = document.createElement('div');
  d.className = 'item' + (na ? ' na' : '');
  d.innerHTML = '<div class="nm">' + esc(label) + '</div>'
    + '<span class="chip ' + chip[0] + '">' + esc(na ? 'not used' : chip[1]) + '</span>'
    + '<div class="sub">' + esc(subtext) + '</div>';
  d.onclick = onOpen;
  v.appendChild(d);
}

/* THE MENU, SECTION BY SECTION, IN THE ORDER IT IS PRINTED.
   He can hold the phone next to the board on the wall and go down it. Items
   with no recipe are called out rather than hidden: 20 of the 55 have none,
   and two of those are the biggest sellers in the building. */
function drawDishes(v) {
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = 'Every item on the ' + DATA.menuName + ' boards and the Loft menu, '
    + 'in the order they are printed. Open one and you get its ingredients one per line, '
    + 'each with four taps: Right, Change amount, Wrong item, Old item. Saying "Right" '
    + 'is worth as much as a fix — it is the only way an amount stops being a guess. '
    + 'The ones marked NO RECIPE have nothing behind them at all.';
  v.appendChild(n);
  newBar(v, 'dish');

  for (const sec of DATA.menu) {
    const missing = sec.items.filter((i) =>
      (!i.recipe || !(i.lines || []).length) && !isNa('dish', i.handle)).length;
    head(v, sec.section, missing ? missing + ' with no recipe' : sec.items.length + ' items');
    if (sec.note) {
      const sn = document.createElement('div');
      sn.className = 'note';
      sn.textContent = sec.note;
      v.appendChild(sn);
    }
    for (const it of sec.items) {
      const bad = (it.lines || []).filter((l) => l.status && l.status !== 'costed').length;
      /* A recipe row with no lines is not a costed dish. Nachos had one, and
         it rendered as "not checked · 0 ingredients" — which reads as a dish
         somebody merely has not looked at, rather than an empty shell. */
      const empty = it.recipe && !(it.lines || []).length;
      const prog = lineProgress('dish', it.handle, it.lines);
      const chip = !it.recipe ? ['no', 'no recipe']
        : empty ? ['no', 'recipe is empty']
        : prog.total && prog.done === prog.total ? ['ok', 'all ' + prog.total + ' answered']
        : prog.done ? ['q', prog.done + ' of ' + prog.total + ' answered']
        : isDone('dish', it.handle) ? ['ok', 'checked']
        : bad ? ['q', bad + ' unpriced']
        : it.reviewed_by ? ['ok', 'confirmed'] : ['q', 'not checked'];
      const bits = [];
      if (it.sizes) bits.push(it.sizes.map((z) => z[0]).join(' / '));
      if (empty) bits.push('nothing in it yet');
      else if (it.recipe) bits.push(it.lines.length + ' ingredients');
      else bits.push('nothing written down');
      if (HAS_MONEY && it.price != null) bits.push('menu ' + money(it.price));
      if (HAS_MONEY && it.recipe && it.cost != null) bits.push('food ' + money(it.cost));
      if (it.units) bits.push(Math.round(it.units).toLocaleString() + ' sold');
      if (it.recipe && it.recipe !== it.name) bits.push('recipe: ' + it.recipe);
      rowFor(v, 'dish', it.handle, it.name, bits.join(' · '), chip,
        () => { open = { kind: 'dish', name: it.handle }; draw(); });
    }
  }

  /* Costed, but not on these boards. Not junk — Shrimp Ceviche came off the
     Loft menu and the recipe is good — but it should not sit in the middle of
     the current menu pretending to be on it. */
  if ((DATA.offMenu || []).length) {
    head(v, 'We have a recipe, but it is not on these menus', DATA.offMenu.length + ' items');
    for (const o of DATA.offMenu) {
      const it = DATA.dishes.find((d) => d.recipe === o.recipe);
      rowFor(v, 'dish', o.recipe, o.recipe, o.why,
        isDone('dish', o.recipe) ? ['ok', 'handled'] : ['q', 'off menu'],
        () => { open = { kind: 'dish', name: o.recipe }; draw(); });
    }
  }
}

function drawBatches(v) {
  const missing = DATA.batches.filter((b) => !b.lines.length);
  const written = DATA.batches.filter((b) => b.lines.length);
  head(v, 'Anything we make that is not listed', 'add it');
  newBar(v, 'batch');
  if (missing.length) {
    head(v, 'No build sheet yet', missing.length + ' to write');
    const n = document.createElement('div');
    n.className = 'note crit';
    n.textContent = 'These are the ones holding everything up. Each has a name and nothing else, '
      + 'so any plate using it cannot be costed. Write what goes in one batch and what it makes.';
    v.appendChild(n);
    for (const b of missing)
      rowFor(v, 'batch', b.name, b.name,
        b.mine ? 'you added this · makes ' + b.yield
          : (b.blocks ? b.blocks + ' dish' + (b.blocks === 1 ? '' : 'es') + ' waiting on it'
                      : 'not used by any dish yet'),
        b.mine ? ['q','yours'] : isDone('batch', b.name) ? ['ok','written'] : ['no','no recipe'],
        () => { open = { kind: 'batch', name: b.name }; draw(); });
  }
  head(v, 'Already written', written.length + ' batches');
  for (const b of written)
    rowFor(v, 'batch', b.name, b.name, b.lines.length + ' ingredients · makes ' + b.yield,
      isDone('batch', b.name) ? ['ok','checked'] : ['q','not checked'],
      () => { open = { kind: 'batch', name: b.name }; draw(); });
}

/* SORTED BY WHETHER IT IS STILL ON THE MENU, NOT BY MONEY.
   116 items sell here with no recipe. An undifferentiated list of 116 is an
   evening of scanning, and the two biggest sellers in the building are in it.
   The sales dates separate current from discontinued for free, so they do. */
function drawNeedLink(v) {
  const live = [], quiet = [], gone = [], staff = [];
  for (const x of DATA.needlink) {
    (x[5] ? staff : x[4] <= 14 ? live : x[4] <= 45 ? quiet : gone).push(x);
  }
  const byOrders = (a, b) => b[2] - a[2];
  live.sort(byOrders); quiet.sort(byOrders); gone.sort(byOrders); staff.sort(byOrders);

  const zone = (list, label, right, noteText, noteClass) => {
    if (!list.length) return;
    head(v, label, right);
    if (noteText) {
      const n = document.createElement('div');
      n.className = 'note' + (noteClass ? ' ' + noteClass : '');
      n.textContent = noteText;
      v.appendChild(n);
    }
    for (const x of list) {
      const [item, rev, units, price, days] = x;
      rowFor(v, 'pos_item', item, item,
        (HAS_MONEY ? '$' + Math.round(rev).toLocaleString() + ' sold · ' : '')
          + units.toLocaleString() + ' orders · '
          + (days === 0 ? 'sold today' : days === 1 ? 'sold yesterday' : 'last sold ' + days + ' days ago')
          + (HAS_MONEY ? ' · menu ' + money(price) : ''),
        isDone('pos_item', item) ? ['ok','handled'] : ['no','no recipe'],
        () => { open = { kind: 'pos_item', name: item }; draw(); });
    }
  };

  zone(live, 'Still selling — these need a recipe', live.length + ' items',
    'Sold in the last two weeks with nothing behind them. This is the list that '
    + 'matters: until these are written we cannot cost what the kitchen actually sends out.',
    'crit');
  zone(quiet, 'Quiet for a few weeks', quiet.length + ' items',
    'Nothing in two to six weeks. Seasonal, or gone — you will know which.');
  zone(gone, 'Not sold in six weeks', gone.length + ' items',
    'Almost certainly off the menu: old specials, discontinued items, one-offs. '
    + 'One tap each and they stop counting against us.');
  zone(staff, 'Staff meals', staff.length + ' items',
    'Same food as the real dish, rung at a staff price. Nothing to write here — '
    + 'we will point these at the dish they are a copy of.');
}

/* ---------- the editor ---------------------------------------------------- */
/* `open.name` is always the HANDLE — what edits get filed against — never the
   label. Looking a dish up by its menu name broke the moment the menu and the
   recipe disagreed, which is most of the interesting ones. */
function findOpen() {
  if (open.kind === 'dish')
    return DATA.dishes.find((d) => d.handle === open.name)
        || { name: open.name, handle: open.name, recipe: open.name, lines: [], offMenu: true };
  if (open.kind === 'batch') return DATA.batches.find((b) => b.name === open.name);
  return { name: open.name, handle: open.name, lines: [] };
}

function drawEdit() {
  el('listView').classList.add('hide');
  const w = el('editView');
  w.classList.remove('hide');
  const o = findOpen();
  const kind = open.kind;
  const pend = queuedFor(kind, open.name);
  w.innerHTML = '';

  const pane = document.createElement('div');
  pane.className = 'pane';

  const back = document.createElement('button');
  back.className = 'btn sm'; back.textContent = '← Back to the list';
  back.onclick = () => { open = null; draw(); };
  pane.appendChild(back);

  const h = document.createElement('h2');
  h.style.margin = '12px 0 2px'; h.textContent = o.name;
  pane.appendChild(h);

  const meta = document.createElement('div');
  meta.className = 'stat';
  if (kind === 'dish') {
    const bits = [];
    if (o.sizes) bits.push(o.sizes.map((z) => z[0] + (HAS_MONEY && z[1] != null ? ' ' + money(z[1]) : '')).join(' / '));
    else if (HAS_MONEY && o.price != null) bits.push('menu ' + money(o.price));
    if (o.recipe) {
      bits.push(o.lines.length + ' ingredient' + (o.lines.length === 1 ? '' : 's'));
      if (HAS_MONEY && o.cost != null) bits.push('food ' + money(o.cost));
    } else bits.push('no recipe yet');
    if (o.pos && o.pos.length && o.pos[0] !== o.name) bits.push('rings as "' + o.pos[0] + '"');
    if (o.tags && o.tags.length) bits.push(o.tags.join(' '));
    meta.textContent = bits.join(' · ');
  } else meta.textContent = kind === 'batch'
    ? (o.lines.length ? 'makes ' + o.yield : 'no build sheet yet')
    : 'sold at Cochrane with no recipe behind it';
  pane.appendChild(meta);

  if (pend.length) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = pend.length + ' change' + (pend.length === 1 ? '' : 's')
      + ' queued on this one. Send when you are ready.';
    pane.appendChild(n);
  }

  if (kind === 'dish' && o.note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = 'From the menu: ' + o.note;
    pane.appendChild(n);
  }

  /* Ten wing sauces and six chip seasonings are ten and six different food
     costs. The plate cannot be costed honestly until we know which. */
  if (kind === 'dish' && o.choices && o.choices.length) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = 'Sold in ' + o.choices.length + ' flavours: ' + o.choices.join(', ')
      + '. Each is a different cost — write the recipe for the plain one here, and '
      + 'add each sauce or seasoning as a batch in the next tab.';
    pane.appendChild(n);
  }

  if (kind === 'dish' && !o.mine && (!o.recipe || !o.lines.length)) {
    const n = document.createElement('div');
    n.className = 'note crit';
    n.textContent = o.recipe
      ? 'We have a card for this but nothing is written on it. Add what goes on the plate.'
      : 'This is on the menu and there is nothing written down for it at all. '
        + 'Start it and add what goes on the plate.';
    pane.appendChild(n);
  }

  if (o.mine) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = 'You added this one'
      + (kind === 'batch' ? ' — one batch makes ' + o.yield + '. ' : '. ')
      + 'Add what goes in it and send. It does not exist anywhere until you do.';
    pane.appendChild(n);
  }

  if (kind === 'pos_item') {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = 'There is no recipe for this yet. Either it is off the menu — one click — '
      + 'or start it and add the ingredients.';
    pane.appendChild(n);
  }

  if (kind === 'batch' && !o.lines.length && !o.mine) {
    const n = document.createElement('div');
    n.className = 'note crit';
    n.textContent = 'Write one batch: what goes in, and what the finished batch makes '
      + '(weight is best — 2000 g rather than "a tub"). Grams and millilitres beat cups '
      + 'for anything dry; a cup of salt and a cup of sugar weigh very different amounts.';
    pane.appendChild(n);
    const yq = document.createElement('div');
    yq.className = 'row'; yq.style.margin = '10px 0';
    yq.innerHTML = '<span class="stat" style="flex:0 0 auto">One batch makes</span>'
      + '<div style="flex:0 0 96px"><input type="text" inputmode="decimal" id="yq" placeholder="2000"></div>'
      + '<div style="flex:0 0 96px"><select id="yu">'
      + LINE_UOMS.map((u) => '<option>' + u + '</option>').join('') + '</select></div>';
    pane.appendChild(yq);
  }

  /* existing lines */
  if (o.lines && o.lines.length) {
    const pr = lineProgress(kind, o.handle, o.lines);
    const lh = document.createElement('div');
    lh.className = 'stat'; lh.style.margin = '14px 0 2px';
    lh.textContent = pr.done
      ? 'What goes in — ' + pr.done + ' of ' + pr.total + ' answered'
      : 'What goes in — is each one right?';
    pane.appendChild(lh);
    for (const l of o.lines) pane.appendChild(lineRow(kind, o.handle, l));
  }

  /* pending added lines, so he can see what he has just built up */
  const added = pend.filter((q) => q.action === 'add');
  if (added.length) {
    const ah = document.createElement('div');
    ah.className = 'stat'; ah.style.margin = '14px 0 2px';
    ah.textContent = 'Adding';
    pane.appendChild(ah);
    for (const q of added) {
      const d = document.createElement('div');
      d.className = 'line';
      d.innerHTML = '<div class="ing">' + esc(q.label) + '<small>new line</small></div>'
        + '<div class="mono">' + esc(q.qty) + '</div><div class="mono">' + esc(q.uom) + '</div>';
      const rm = document.createElement('button');
      rm.className = 'btn sm'; rm.textContent = 'undo';
      rm.onclick = () => { queue = queue.filter((x) => x.id !== q.id); saveQueue(); drawQueue(); drawEdit(); };
      d.appendChild(rm);
      pane.appendChild(d);
    }
  }

  const bar = document.createElement('div');
  bar.className = 'bar';

  const addBtn = document.createElement('button');
  addBtn.className = 'btn'; addBtn.textContent = '+ Add an ingredient';
  addBtn.onclick = () => addLine(kind, o.handle);
  bar.appendChild(addBtn);

  if (kind !== 'pos_item' && o.lines && o.lines.length) {
    const ok = document.createElement('button');
    ok.className = 'btn pri'; ok.textContent = 'The whole dish is right';
    ok.onclick = () => {
      push({ target_kind: kind, recipe_name: o.handle, action: 'confirm',
             label: 'checked in the kitchen and correct' });
      open = null; draw();
    };
    bar.appendChild(ok);
  }

  if (kind === 'pos_item' || (kind === 'dish' && !o.recipe && !o.mine)) {
    const start = document.createElement('button');
    start.className = 'btn pri'; start.textContent = 'Start a recipe for this';
    start.onclick = () => {
      push({ target_kind: 'dish', recipe_name: o.handle, action: 'new_recipe',
             label: kind === 'dish' ? 'on the ' + DATA.menuName + ' menu with no recipe'
                                    : 'started from the sold-with-no-recipe list' });
      drawEdit();
    };
    bar.appendChild(start);
  }

  const na = document.createElement('button');
  na.className = 'btn crit';
  na.textContent = kind === 'batch' ? 'We do not make this' : 'Not on the menu';
  na.onclick = () => {
    const why = prompt('Anything worth noting? (optional)\n\n"Not on the menu" hides it and stops '
      + 'it counting against our coverage. If it sells again, the system says so.') || null;
    push({ target_kind: kind, recipe_name: o.handle, action: 'not_used', label: why });
    open = null; draw();
  };
  bar.appendChild(na);

  pane.appendChild(bar);
  w.appendChild(pane);
}

/* Four answers, and the fast one is first and biggest.
   "Right" is not a no-op: it promotes the amount from an inherited estimate
   to a measurement with his name on it, which is the strongest evidence we
   can get short of a scale. That is why it is sent rather than just ticked
   locally. */
function lineRow(kind, recipe, l) {
  const key = l.sku || l.name;
  const mine = queuedFor(kind, recipe).filter((q) =>
    (q.from_product_sku && q.from_product_sku === l.sku)
    || (!l.sku && q.from_sub_recipe === l.name));
  const said = mine.length ? mine[mine.length - 1] : null;

  const d = document.createElement('div');
  d.className = 'line'
    + (said && said.action === 'confirm' ? ' answered' : '')
    + (said && said.action === 'remove' ? ' dropped' : '');

  const top = document.createElement('div');
  top.className = 'lrow';
  const ing = document.createElement('div');
  ing.className = 'ing';
  ing.innerHTML = esc(l.name) + '<small>' + esc(l.sku ? 'GFS ' + l.sku : 'house batch') + '</small>';
  /* WE ALREADY KNOW THIS (owner, 2 Sep 2026):
       "lots of stuff you do know the recipe that we gave you, so that should be
        on there ... i can tell for example cause wings the pdf you gave had
        carrot qty this website asks him to input ... the more work we can take
        from him the better"

     Dead right, and it was my bug. Every one of the 19 lines flagged
     omitted_unknown_qty HAS a quantity — 2 EA of celery, 10 EA of wings — and
     I was reading that flag as "no amount". It means something completely
     different: we know the amount and cannot COST it, because nobody has
     recorded what one celery stick weighs. Asking the chef to type in a number
     we already have off his own costing sheet is exactly the busywork to
     remove. So: if there is a quantity, show it and let him confirm it. */
  const hasQty = Number(l.qty) > 0;
  const uncostable = hasQty && l.status && l.status !== 'costed';
  const noQty = !hasQty;
  const amt = document.createElement('div');
  amt.className = 'amt' + (noQty ? ' none' : '');
  amt.textContent = noQty ? 'no amount yet' : l.qty + ' ' + l.uom;
  top.appendChild(ing); top.appendChild(amt);
  d.appendChild(top);

  /* Already answered: show what he said and let him undo it. Nothing is more
     confusing than tapping a thing and having it look exactly the same. */
  if (said) {
    const a = document.createElement('div');
    a.className = 'answer' + (said.action === 'remove' ? ' crit' : '');
    a.textContent = said.action === 'confirm' ? 'you said this is right'
      : said.action === 'remove' ? 'you said this is not in it any more'
      : said.action === 'set_qty' ? 'you changed it to ' + said.qty + ' ' + said.uom
      : said.action === 'repoint' ? 'you changed it: ' + said.label
      : said.label || said.action;
    d.appendChild(a);
    const taps = document.createElement('div');
    taps.className = 'taps';
    const undo = document.createElement('button');
    undo.className = 'tap'; undo.textContent = 'undo';
    undo.onclick = () => { queue = queue.filter((x) => x.id !== said.id); saveQueue(); drawQueue(); drawEdit(); };
    taps.appendChild(undo);
    d.appendChild(taps);
    return d;
  }

  /* A DIFFERENT QUESTION, ASKED SEPARATELY.
     "2 carrot sticks" is a recipe fact and he can confirm it in one tap. What
     one carrot stick WEIGHS is a scale job, and mixing the two into a single
     "type the amount" box is what made this feel like homework. So the line
     confirms as normal and the weight is asked for underneath, optionally. */
  if (uncostable) {
    const w = document.createElement('div');
    w.className = 'answer crit';
    w.textContent = 'This amount is fine — we just cannot price it until someone '
      + 'measures one. Confirm the amount, and if you know what one weighs or '
      + 'holds, add it in whatever unit you think in.';
    d.appendChild(w);
  }

  const taps = document.createElement('div');
  taps.className = 'taps';

  const tap = (label, cls, fn) => {
    const b = document.createElement('button');
    b.className = 'tap' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.onclick = fn;
    taps.appendChild(b);
    return b;
  };

  /* 1. RIGHT. Offered wherever there is an amount to be right about — which,
        after the fix above, is every line but the genuinely blank ones. */
  if (hasQty) tap('\u2713 Right', 'yes', () => {
    push({ target_kind: kind, recipe_name: recipe, action: 'confirm',
           from_product_sku: l.sku || null, from_sub_recipe: l.sku ? null : l.name,
           qty: Number(l.qty), uom: l.uom,
           label: 'confirmed ' + l.name + ' at ' + l.qty + ' ' + l.uom });
    drawEdit();
  });

  /* 2. WRONG AMOUNT — reveals a number pad in place, rather than sitting
        on the row all the time waiting to be fat-fingered. */
  tap(noQty ? 'Set the amount' : 'Change amount', '', () => {
    taps.remove();
    const box = document.createElement('div');
    box.className = 'qedit';
    const qi = document.createElement('input');
    qi.type = 'text'; qi.inputMode = 'decimal';
    qi.value = noQty ? '' : l.qty;
    qi.placeholder = 'how much';
    const us = document.createElement('select');
    us.innerHTML = LINE_UOMS.map((u) => '<option' + (u === l.uom ? ' selected' : '') + '>' + u + '</option>').join('');
    const save = document.createElement('button');
    save.className = 'tap done'; save.textContent = 'Save';
    save.onclick = () => {
      const v = parseFloat(qi.value);
      if (!(v > 0)) { qi.focus(); return; }
      push({ target_kind: kind, recipe_name: recipe, action: 'set_qty',
             from_product_sku: l.sku || null, from_sub_recipe: l.sku ? null : l.name,
             qty: v, uom: us.value,
             label: (noQty ? 'set ' : 'was ' + l.qty + ' ' + l.uom + ', now ')
               + (noQty ? '' : '') + v + ' ' + us.value });
      drawEdit();
    };
    const cancel = document.createElement('button');
    cancel.className = 'tap'; cancel.textContent = 'cancel';
    cancel.onclick = () => drawEdit();
    box.appendChild(qi); box.appendChild(us); box.appendChild(save); box.appendChild(cancel);
    d.appendChild(box);
    qi.focus();
  });

  /* 2b. WHAT DOES ONE WEIGH — only where that is the thing blocking a cost.
         Sent as a set_qty in grams against the same line, which is exactly
         what the loader needs to make it costable. */
  if (uncostable) tap('One weighs…', '', () => {
    taps.remove();
    const box = document.createElement('div');
    box.className = 'qedit';
    box.style.flexWrap = 'wrap';

    const said = document.createElement('div');
    said.className = 'answer';
    said.style.flex = '1 0 100%';
    said.textContent = 'What does ONE of these weigh or measure? We multiply by the '
      + l.qty + ' in the recipe.';
    box.appendChild(said);

    const qi = document.createElement('input');
    qi.type = 'text'; qi.inputMode = 'decimal';
    qi.placeholder = 'for one';

    /* THE UNIT IS HIS TO PICK (owner, 2 Sep 2026):
         "when we select 'one weighs' we want to be able to switch unit of
          measurement"

       It was hardcoded to grams, which is fine for a celery stick and useless
       for a lemon wedge in fluid ounces or a bun somebody knows in pounds. A
       box that only accepts the unit the system prefers gets the number typed
       into it in a different unit, and nothing anywhere says so.

       EA is deliberately not on this list: "one of them weighs one each" says
       nothing, and it is the one answer that would multiply out to the same
       uncostable line it started as. */
    const EACH_UOMS = LINE_UOMS.filter((u) => u !== 'EA');
    const us = document.createElement('select');
    us.innerHTML = EACH_UOMS.map((u) => '<option' + (u === 'G' ? ' selected' : '') + '>' + u + '</option>').join('');

    const sum = document.createElement('div');
    sum.className = 'answer';
    sum.style.flex = '1 0 100%';
    const restate = () => {
      const one = parseFloat(qi.value);
      sum.textContent = one > 0
        ? l.qty + ' \u00d7 ' + one + ' ' + us.value + ' = '
          + (Math.round(one * Number(l.qty) * 1000) / 1000) + ' ' + us.value
        : '';
    };
    qi.addEventListener('input', restate);
    us.addEventListener('change', restate);

    const save = document.createElement('button');
    save.className = 'tap done'; save.textContent = 'Save';
    save.onclick = () => {
      const one = parseFloat(qi.value);
      if (!(one > 0)) { qi.focus(); return; }
      const total = Math.round(one * Number(l.qty) * 1000) / 1000;
      push({ target_kind: kind, recipe_name: recipe, action: 'set_qty',
             from_product_sku: l.sku || null, from_sub_recipe: l.sku ? null : l.name,
             qty: total, uom: us.value,
             label: l.qty + ' \u00d7 ' + one + ' ' + us.value + ' each = '
               + total + ' ' + us.value });
      drawEdit();
    };
    const cancel = document.createElement('button');
    cancel.className = 'tap'; cancel.textContent = 'cancel';
    cancel.onclick = () => drawEdit();
    box.appendChild(qi); box.appendChild(us); box.appendChild(save); box.appendChild(cancel);
    box.appendChild(sum);
    d.appendChild(box);
    qi.focus();
  });

  /* 3. WRONG ITEM — AND, IN THE SAME BREATH, HOW MUCH (owner, 2 Sep 2026):
        "if its a wrong item, but also wrong qty we can only change the item or
         the qty not both if its a new item and how much"

        Right: a swapped ingredient almost never keeps the old amount. Two taps
        also sent TWO rows, and the second could be refused on its own while
        the first went through, leaving a new ingredient carrying the old
        ingredient's quantity. So the picker now hands straight over to the
        amount, and it leaves as ONE repoint carrying both — the loader already
        applies qty and uom on a repoint, so nothing downstream changes and the
        two facts can never half-land.

        The amount is pre-filled with what is there, so "same amount, different
        product" is still pick-then-Save and no typing. */
  tap('Wrong item', '', () => openPicker('What should be in it instead of "' + l.name + '"?', 'any', (p) => {
    taps.remove();
    const box = document.createElement('div');
    box.className = 'qedit';
    box.style.flexWrap = 'wrap';

    const said = document.createElement('div');
    said.className = 'answer';
    said.style.flex = '1 0 100%';
    said.textContent = p.label + ' — how much of it?';
    box.appendChild(said);

    const qi = document.createElement('input');
    qi.type = 'text'; qi.inputMode = 'decimal';
    qi.value = hasQty ? l.qty : '';
    qi.placeholder = 'how much';
    const us = document.createElement('select');
    us.innerHTML = LINE_UOMS.map((u) => '<option' + (u === l.uom ? ' selected' : '') + '>' + u + '</option>').join('');
    const save = document.createElement('button');
    save.className = 'tap done'; save.textContent = 'Save both';
    save.onclick = () => {
      const v = parseFloat(qi.value);
      if (!(v > 0)) { qi.focus(); return; }
      const changedQty = !hasQty || v !== Number(l.qty) || us.value !== l.uom;
      push({ target_kind: kind, recipe_name: recipe, action: 'repoint',
             from_product_sku: l.sku || null, from_sub_recipe: l.sku ? null : l.name,
             to_product_sku: p.to_product_sku || null, to_sub_recipe: p.to_sub_recipe || null,
             qty: v, uom: us.value,
             label: l.name + ' \u2192 ' + p.label
               + (changedQty ? ', ' + v + ' ' + us.value
                             : ', same amount (' + v + ' ' + us.value + ')') });
      drawEdit();
    };
    const cancel = document.createElement('button');
    cancel.className = 'tap'; cancel.textContent = 'cancel';
    cancel.onclick = () => drawEdit();
    box.appendChild(qi); box.appendChild(us); box.appendChild(save); box.appendChild(cancel);
    d.appendChild(box);
    qi.focus(); qi.select();
  }));

  /* 4. OLD ITEM — the one the owner asked for by name. Not a delete: it
        becomes a remove edit the morning build replays and prints. */
  tap('Old item', 'old', () => {
    push({ target_kind: kind, recipe_name: recipe, action: 'remove',
           from_product_sku: l.sku || null, from_sub_recipe: l.sku ? null : l.name,
           label: 'not used any more: ' + l.name });
    drawEdit();
  });

  d.appendChild(taps);
  return d;
}

function addLine(kind, recipe) {
  openPicker('Add to "' + recipe + '"', 'any', (p) => {
    const q = prompt('How much ' + p.label + '?\n\nJust the number.');
    if (q == null) return;
    const v = parseFloat(q);
    if (!(v > 0)) { alert('That needs to be a number bigger than zero.'); return; }
    const u = prompt('What unit?\n\n' + LINE_UOMS.join('  ') + '\n\nGrams or millilitres are best.', 'G');
    if (!u || !LINE_UOMS.includes(u.toUpperCase())) { alert('Use one of: ' + LINE_UOMS.join(', ')); return; }
    push({ target_kind: kind, recipe_name: recipe, action: 'add',
           to_product_sku: p.to_product_sku || null, to_sub_recipe: p.to_sub_recipe || null,
           qty: v, uom: u.toUpperCase(), label: p.label + ' ' + v + ' ' + u.toUpperCase() });
    drawEdit();
  });
}

/* ---------- sending ------------------------------------------------------- */
el('send').onclick = async () => {
  const btn = el('send');
  const who = el('who').value.trim();
  if (!who) { el('who').focus(); el('who').classList.add('nomatch'); return; }
  el('who').classList.remove('nomatch');
  btn.disabled = true; btn.textContent = 'Sending…';
  /* One row per change, each with its own id, so a send that dies halfway can
     be finished rather than started again. The button locks while it runs:
     the count sheet was sent twice, 39 seconds apart, on its first outing. */
  let failed = 0;
  for (const q of queue.filter((x) => !x.sent)) {
    /* A new batch carries its yield; read it off the form if it is showing. */
    let yq = null, yu = null;
    if (q.action === 'new_recipe' && q.target_kind === 'batch') {
      const a = el('yq'), b = el('yu');
      if (a && parseFloat(a.value) > 0) { yq = parseFloat(a.value); yu = b.value; }
    }
    try {
      const res = await fetch(SUPA, {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: q.id, submitted_at: q.submitted_at, edited_by: who,
          recipe_name: q.recipe_name, action: q.action, target_kind: q.target_kind,
          from_product_sku: q.from_product_sku || null, from_sub_recipe: q.from_sub_recipe || null,
          to_product_sku: q.to_product_sku || null, to_sub_recipe: q.to_sub_recipe || null,
          qty: q.qty == null ? null : q.qty, uom: q.uom || null,
          yield_qty: q.yield_qty != null ? q.yield_qty : yq,
          yield_uom: q.yield_uom || yu,
          reason: q.label || null,
        }),
      });
      if (res.ok) { q.sent = true; saveQueue(); } else { failed++; }
    } catch (e) { failed++; }
  }
  drawQueue(); draw();
  btn.disabled = !!failed;
  btn.textContent = failed ? 'Retry ' + failed : 'Sent — applies at the next morning build';
};

el('hdr').textContent = 'recipe check · Cochrane brewpub & loft · built ' + BUILT;
drawQueue(); draw();
</script>
</body>
